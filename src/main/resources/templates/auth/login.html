<!DOCTYPE html>
<html lang="lt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prisijungti · Močiutės Receptai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
            font-family: Georgia, 'Times New Roman', serif;
            color: #3b2a1f;
            background: #fffaf2;
        }

        header {
            background: #f5e9d7;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid #e6d5b8;
        }

        header h1 {
            font-size: clamp(1.5rem, 4vw, 2.4rem);
            letter-spacing: 0.08em;
        }

        header a {
            color: inherit;
            text-decoration: none;
        }

        main {
            max-width: 460px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .auth-card {
            background: #fff;
            border: 1px solid #e6d5b8;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 12px rgba(59, 42, 31, 0.08);
        }

        h2 {
            font-size: 1.7rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .message {
            border-radius: 6px;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .success {
            background: #edf7e8;
            border: 1px solid #cfe6c4;
            color: #355d2a;
        }

        .error {
            background: #fff0ed;
            border: 1px solid #e8b9ae;
            color: #8a3325;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #e6d5b8;
            border-radius: 6px;
            color: #3b2a1f;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #d8bd95;
            outline-offset: 2px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 6px;
            padding: 0.9rem 1.25rem;
            background: #8a5a3b;
            color: #fffaf2;
            font: inherit;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #6d4529;
        }

        .auth-links {
            margin-top: 1.25rem;
            text-align: center;
            line-height: 1.6;
        }

        .auth-links a {
            color: #8a5a3b;
            text-decoration: none;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1><a th:href="@{/main}">MOČIUTĖS RECEPTAI</a></h1>
    </header>

    <main>
        <section class="auth-card">
            <h2>Prisijungti</h2>

            <p class="message success" th:if="${registered}">
                Paskyra sukurta. Dabar galite prisijungti.
            </p>

            <p class="message error" th:if="${param.error}">
                Neteisingas vartotojo vardas arba slaptažodis.
            </p>

            <p class="message success" th:if="${param.logout}">
                Sėkmingai atsijungėte.
            </p>

            <form th:action="@{/login}" method="post" autocomplete="off">
                <th:block th:replace="~{fragments/csrf :: token}"/>
                <label for="username">Vartotojo vardas</label>
                <input id="username"
                       name="username"
                       type="text"
                       autocomplete="off"
                       autocapitalize="none"
                       spellcheck="false"
                       required>

                <label for="password">Slaptažodis</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Prisijungti</button>
            </form>

            <div class="auth-links">
                <p>Neturite paskyros? <a th:href="@{/register}">Nauja paskyra</a></p>
                <p><a th:href="@{/main}">Grįžti į receptus</a></p>
            </div>
        </section>
    </main>
</body>
</html>
